
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLIPORA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #29314b;font-size:23px;font-weight:bold}
header span,h1 span{color:#a78bfa}
main{max-width:850px;margin:65px auto;padding:20px}
.tag{color:#a78bfa;letter-spacing:2px;font-size:13px}
h1{font-size:clamp(38px,8vw,65px);line-height:1.1}
p{color:#bac3d8;line-height:1.7}
.panel{background:#171f35;padding:24px;border-radius:18px;border:1px solid #303b5c;margin-top:30px}
label{display:block;margin:18px 0 8px}
input,select{width:100%;padding:14px;border-radius:9px;border:1px solid #455170;background:#0b1020;color:white}
button{width:100%;padding:15px;background:#7c3aed;color:white;border:0;border-radius:9px;margin-top:20px;font-weight:bold}
.note{font-size:12px}
</style>
</head>
<body>
<header>CLIPORA <span>AI</span></header>
<main>
<div class="tag">ONE VIDEO. ENDLESS POSSIBILITIES.</div>
<h1>Turn long videos into <span>short clips.</span></h1>
<p>Create content for YouTube Shorts, Instagram Reels and TikTok.</p>
<div class="panel">
<h2>Start creating</h2>
<label>Video URL</label>
<input type="url" placeholder="Paste your video link">
<label>Or upload a video</label>
<input type="file" accept="video/*">
<label>Clip length</label>
<select><option>30–60 seconds</option><option>15–30 seconds</option><option>60–90 seconds</option></select>
<button onclick="alert('Welcome to CLIPORA AI! The AI engine will be connected in a future update.')">Get started</button>
<p class="note">Prototype version. AI video processing is not connected yet.</p>
</div>
</main>
</body>
</html>
